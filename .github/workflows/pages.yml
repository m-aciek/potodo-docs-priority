name: Publish translation priorities

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out priority utility
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out CPython documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: python/cpython
          path: sources/cpython
          sparse-checkout: |
            Doc
            Include

      - name: Check out Polish CPython translations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: python/python-docs-pl
          path: sources/python-docs-pl

      - name: Check out Sphinx documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: sphinx-doc/sphinx
          path: sources/sphinx
          sparse-checkout: doc

      - name: Check out Polish Sphinx translations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: sphinx-doc/sphinx-doc-translations
          path: sources/sphinx-doc-translations
          sparse-checkout: |
            locales/.tx
            locales/pl_PL
          sparse-checkout-cone-mode: false

      - name: Check out Packaging documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: pypa/packaging.python.org
          path: sources/packaging
          sparse-checkout: source

      - name: Check out Polish Packaging translations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: pypa/packaging.python.org
          ref: translation/source
          path: sources/packaging-translations
          sparse-checkout: locales/pl

      - name: Check out Plausible statistics
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: AA-Turner/plausible-stats
          path: sources/plausible-stats
          sparse-checkout: |
            stats/docs.python.org_*
            stats/packaging.python.org_*
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the HTML report utility
        run: python -m pip install '.[html]'

      - name: Build the site
        run: |
          potodo-docs-priority-html \
            --language pl \
            --sphinx-language pl_PL \
            --plausible-stats sources/plausible-stats \
            --cpython-source sources/cpython \
            --cpython-translations sources/python-docs-pl \
            --packaging-source sources/packaging/source \
            --packaging-translations sources/packaging-translations/locales \
            --sphinx-source sources/sphinx/doc \
            --sphinx-translations sources/sphinx-doc-translations/locales \
            --output _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
