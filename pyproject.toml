[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "potodo-docs-priority"
version = "0.1.0"
description = "Prioritize translation resources for Sphinx documentation projects."
authors = [{ name = "Maciej Olko", email = "maciej.olko@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["potodo>=0.35"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
]

[project.scripts]
potodo-docs-priority = "potodo_docs_priority.cli:main"
potodo-docs-priority-html = "potodo_docs_priority.html_cli:main"

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "mypy",
    "pylint",
    "pytest",
    "siphashc>=2",
]
html = ["siphashc>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]

[tool.isort]
profile = "black"

[tool.mypy]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pylint]
disable = [
    "missing-function-docstring",
    "missing-module-docstring",
    "too-many-arguments",
    "too-many-locals",
    "too-many-positional-arguments",
]
